[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yui-daily"
version = "1.0.0"
description = "Yui Daily — a local-first terminal agenda and task system"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "yui" }]
keywords = ["productivity", "agenda", "tasks", "obsidian", "tui", "cli"]

dependencies = [
    "textual>=0.80.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[project.scripts]
yui = "yui.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["yui"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
