name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  wheel:
    runs-on: ubuntu-latest
    env:
      SOURCE_DATE_EPOCH: "315532800"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Verify tag matches package version
        id: package
        run: |
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${PACKAGE_VERSION}" = "${GITHUB_REF_NAME}"
          echo "version=${PACKAGE_VERSION}" >> "${GITHUB_OUTPUT}"
      - name: Build wheel and checksum
        run: |
          python -m pip wheel . --no-deps --wheel-dir dist
          cd dist
          sha256sum -c "../checksums/v${{ steps.package.outputs.version }}.sha256"
          cp "../checksums/v${{ steps.package.outputs.version }}.sha256" SHA256SUMS
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.whl dist/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Yui Daily ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
